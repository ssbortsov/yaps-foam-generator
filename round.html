<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAPS — пузыри</title>
<meta name="description" content="Генератор паттерна из круглых пузырей по взвешенной диаграмме Вороного, экспорт в SVG.">
<style>
:root{
  --paper:#e7eae4;
  --panel:#ffffff;
  --ink:#191c18;
  --muted:#6b7268;
  --line:#cfd4ca;
  --mark:#e0321f;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.006em;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 18px;margin-bottom:22px}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-0.02em}
header p{margin:0;color:var(--muted);font-size:14px;max-width:52ch}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;justify-content:center}
#foam{display:block;width:100%;height:auto;overflow:hidden}
#foam.portrait{width:auto;max-width:100%;height:85vh}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px}
@media(min-width:900px){.panel{position:sticky;top:20px}}
.set+.set{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.set h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:11px}
.ctl label{font-size:13px;color:var(--ink)}
.ctl output{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ctl input[type=range]{grid-column:1/-1;width:100%;margin:2px 0 0;accent-color:var(--mark);height:18px}
.colors{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.colors label{display:flex;align-items:center;gap:7px;font-size:13px}
input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer}
.seed{display:flex;gap:8px;align-items:center;margin-top:4px}
.seed input[type=number]{width:96px;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink)}
button{font:inherit;font-size:13px;padding:8px 13px;border:1px solid var(--ink);border-radius:2px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{background:var(--ink);color:var(--panel)}
button.go{background:var(--mark);border-color:var(--mark);color:#fff}
button.go:hover{background:var(--ink);border-color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.note{margin-top:14px;font-size:12px;line-height:1.45;color:var(--muted)}
.ratios{display:flex;gap:6px;flex-wrap:wrap}
.ratios button{font-size:12px;padding:5px 11px;border-color:var(--line);color:var(--muted)}
.ratios button.active,.ratios button:hover{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.nav{font-size:13px;color:var(--muted)}
.nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.nav a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>YAPS — пузыри</h1>
  <p>Пузыри строятся как вписанные окружности в ячейки Вороного. Ползунок «Жидкость» мягко дотягивает каждый пузырь к соседям — форма остаётся круглой, но чуть адаптируется к окружению.</p>
  <span class="nav"><a href="index.html">← Пена</a></span>
</header>

<div class="grid">

  <div class="stage">
    <svg id="foam" viewBox="0 0 640 360" role="img" aria-labelledby="ft fd">
      <title id="ft">Паттерн пузырей</title>
      <desc id="fd">Круглые пузыри разного размера, слегка адаптированные к форме ячеек Вороного.</desc>
      <defs><clipPath id="fclip"><rect id="fclipr" x="0" y="0" width="640" height="360"/></clipPath></defs>
      <g clip-path="url(#fclip)">
        <rect id="bg" x="0" y="0" width="640" height="360" fill="#ffffff"/>
        <path id="mesh" fill="#191c18" fill-rule="evenodd"/>
      </g>
    </svg>
  </div>

  <div class="panel">

    <div class="set">
      <h2>Пропорции</h2>
      <div class="ratios">
        <button class="rbtn" data-w="600" data-h="600">1:1</button>
        <button class="rbtn" data-w="480" data-h="640">3:4</button>
        <button class="rbtn" data-w="360" data-h="640">9:16</button>
        <button class="rbtn active" data-w="640" data-h="360">16:9</button>
        <button class="rbtn" data-w="640" data-h="480">4:3</button>
      </div>
    </div>

    <div class="set">
      <h2>Структура</h2>
      <div class="ctl"><label for="cnt">Плотность</label><output id="cntO">23</output><input type="range" id="cnt" min="12" max="90" step="1" value="23"></div>
      <div class="ctl"><label for="big">Крупных пузырей</label><output id="bigO">6</output><input type="range" id="big" min="0" max="14" step="1" value="6"></div>
      <div class="ctl"><label for="rat">Мелких на крупный</label><output id="ratO">5</output><input type="range" id="rat" min="0" max="6" step="1" value="5"></div>
      <div class="ctl"><label for="spr">Контраст размеров</label><output id="sprO">0.70</output><input type="range" id="spr" min="0" max="70" step="1" value="70"></div>
    </div>

    <div class="set">
      <h2>Форма</h2>
      <div class="ctl"><label for="liq">Жидкость</label><output id="liqO">0.25</output><input type="range" id="liq" min="0" max="100" step="1" value="25"></div>
      <div class="ctl"><label for="thk">Зазор</label><output id="thkO">5.5</output><input type="range" id="thk" min="5" max="200" step="1" value="55"></div>
      <div class="ctl"><label for="tpr">Перепад зазора сверху вниз</label><output id="tprO">0.10</output><input type="range" id="tpr" min="0" max="95" step="1" value="10"></div>
    </div>

    <div class="set">
      <h2>Цвет</h2>
      <div class="colors">
        <label>Сетка <input type="color" id="fg" value="#191c18"></label>
        <label>Ячейки <input type="color" id="bgc" value="#ffffff"></label>
        <label><input type="checkbox" id="tr"> Ячейки прозрачные</label>
      </div>
      <div class="seed">
        <label for="sd" style="font-size:13px">Сид</label>
        <input type="number" id="sd" value="7" min="0" step="1">
        <button id="re">Новый</button>
      </div>
    </div>

    <div class="actions">
      <button class="go" id="dl">Скачать SVG</button>
      <button id="cp">Скопировать настройки</button>
    </div>

    <p class="note" id="info"></p>

  </div>
</div>
</div>

<script>
(function(){
"use strict";
var W=640,H=360,M=110,polys=[];
function el(id){return document.getElementById(id)}
var cnt=el('cnt'),big=el('big'),rat=el('rat'),spr=el('spr'),thk=el('thk'),tpr=el('tpr'),liq=el('liq');
var cntO=el('cntO'),bigO=el('bigO'),ratO=el('ratO'),sprO=el('sprO'),thkO=el('thkO'),tprO=el('tprO'),liqO=el('liqO');
var mesh=el('mesh'),bg=el('bg'),fg=el('fg'),bgc=el('bgc'),tr=el('tr'),sd=el('sd'),info=el('info');
var foam=el('foam'),fclipr=el('fclipr');

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function area(p){var s=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];s+=p[i].x*q.y-q.x*p[i].y}return s/2}
function centroid(p){var s=0,cx=0,cy=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];var c=p[i].x*q.y-q.x*p[i].y;s+=c;cx+=(p[i].x+q.x)*c;cy+=(p[i].y+q.y)*c}s*=3;return s===0?{x:p[0].x,y:p[0].y}:{x:cx/s,y:cy/s}}
function halfplane(poly,pi,pj,wi,wj){
  var out=[],n=poly.length;if(!n)return out;
  function f(p){var dx=p.x-pj.x,dy=p.y-pj.y,ex=p.x-pi.x,ey=p.y-pi.y;return(dx*dx+dy*dy-wj)-(ex*ex+ey*ey-wi)}
  for(var k=0;k<n;k++){
    var A=poly[k],B=poly[(k+1)%n],fa=f(A),fb=f(B);
    if(fa>=0){out.push(A);if(fb<0){var t=fa/(fa-fb);out.push({x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t})}}
    else if(fb>=0){var u=fa/(fa-fb);out.push({x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u})}
  }
  return out;
}

function compute(){
  var n=+cnt.value,spread=+spr.value/100,nb=+big.value,ratio=+rat.value,seed=+sd.value|0;
  cntO.textContent=n;bigO.textContent=nb;ratO.textContent=ratio;sprO.textContent=spread.toFixed(2);
  var r=rng(seed),EW=W+2*M,EH=H+2*M,K=EW*EH/(W*H),N=Math.max(6,Math.round(n*K)),i,j;
  var s=[];
  for(i=0;i<N;i++)s.push({x:-M+r()*EW,y:-M+r()*EH,u:0.3+r()*0.45,c:0});
  var d=Math.sqrt(EW*EH/N);
  var box=[{x:-M-40,y:-M-40},{x:W+M+40,y:-M-40},{x:W+M+40,y:H+M+40},{x:-M-40,y:H+M+40}];
  function cells(w){
    var res=[];
    for(i=0;i<N;i++){
      var p=box.map(function(v){return{x:v.x,y:v.y}});
      for(j=0;j<N&&p.length;j++){if(j!==i)p=halfplane(p,s[i],s[j],w[i],w[j])}
      res.push(p);
    }
    return res;
  }
  function lloyd(it,w){for(var t=0;t<it;t++){var c=cells(w);for(var q=0;q<N;q++){if(c[q].length>2){var g=centroid(c[q]);s[q].x=g.x;s[q].y=g.y}}}}
  var wz=[];for(i=0;i<N;i++)wz.push(0);
  lloyd(3,wz);
  var perm=[];for(i=0;i<N;i++)perm.push(i);
  for(i=N-1;i>0;i--){j=Math.floor(r()*(i+1));var t0=perm[i];perm[i]=perm[j];perm[j]=t0}
  var NB=Math.min(N,Math.round(nb*K)),bigs=[];
  for(i=0;i<NB;i++){s[perm[i]].c=1;bigs.push(perm[i])}
  var NS=0;
  for(var b=0;b<bigs.length;b++){
    var bi=bigs[b],cand=[];
    for(i=0;i<N;i++){if(s[i].c===0)cand.push([Math.hypot(s[i].x-s[bi].x,s[i].y-s[bi].y),i])}
    cand.sort(function(p,q){return p[0]-q[0]});
    for(i=0;i<Math.min(ratio,cand.length);i++){s[cand[i][1]].c=2;NS++}
  }
  var w=[];
  for(i=0;i<N;i++){var u=s[i].c===1?1.55:(s[i].c===2?0:s[i].u);var rad=u*spread*d*0.95;w.push(rad*rad)}
  lloyd(2,w);
  var base0=+thk.value/10,cullMin=(2*base0)*(2*base0);
  for(var cp=0;cp<3;cp++){
    var cl0=cells(w),keep=[],keepW=[],culled=false;
    for(i=0;i<N;i++){
      if(cl0[i].length<3||Math.abs(area(cl0[i]))<cullMin){culled=true;}
      else{keep.push(s[i]);keepW.push(w[i]);}
    }
    if(!culled)break;
    s=keep;w=keepW;N=s.length;
    if(N<3)break;
  }
  var cl=cells(w);
  polys=[];
  for(i=0;i<N;i++){
    var p=cl[i];if(p.length<3)continue;
    var a=area(p);if(Math.abs(a)<4)continue;
    var c2=centroid(p);
    if(c2.x<-M-60||c2.x>W+M+60||c2.y<-M-60||c2.y>H+M+60)continue;
    polys.push({pts:p,cen:c2});
  }
  info.textContent='Крупных '+NB+', мелких '+NS+', всего ячеек '+polys.length+' — включая те, что за кадром.';
  render();
}

/* Расстояние от точки (cx,cy) до границы многоугольника в направлении (dx,dy). */
function rayDist(pts,cx,cy,dx,dy){
  var n=pts.length,best=Infinity;
  for(var i=0;i<n;i++){
    var A=pts[i],B=pts[(i+1)%n];
    var ex=B.x-A.x,ey=B.y-A.y,fx=A.x-cx,fy=A.y-cy;
    var den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-10)continue;
    var t=(-fx*ey+fy*ex)/den;
    var u=(-fx*dy+fy*dx)/den;
    if(t>1e-6&&u>=0&&u<=1&&t<best)best=t;
  }
  return best;
}

/* Строим форму пузыря: 24 точки по кругу, каждая слегка дотянута
   к границе ячейки Вороного на величину liquid*(доступный зазор).
   Соединяем точки сглаженной кривой через средние точки — форма
   остаётся круглой при любом значении liquid. */
function bubblePath(pts,cen,r,g,liquid){
  if(r<1)return '';
  var cx=cen.x,cy=cen.y,N=24,verts=[];
  for(var i=0;i<N;i++){
    var angle=i/N*Math.PI*2;
    var dx=Math.cos(angle),dy=Math.sin(angle);
    var pd=rayDist(pts,cx,cy,dx,dy);
    var slack=Math.max(0, pd-g*0.5-r);
    var ri=r+slack*liquid;
    verts.push({x:cx+ri*dx, y:cy+ri*dy});
  }
  var s2='';
  for(i=0;i<N;i++){
    var prev=verts[(i-1+N)%N],curr=verts[i],next=verts[(i+1)%N];
    var mx=(prev.x+curr.x)/2,my2=(prev.y+curr.y)/2;
    var nx2=(curr.x+next.x)/2,ny2=(curr.y+next.y)/2;
    if(i===0)s2='M'+mx.toFixed(2)+' '+my2.toFixed(2);
    s2+='Q'+curr.x.toFixed(2)+' '+curr.y.toFixed(2)+' '+nx2.toFixed(2)+' '+ny2.toFixed(2);
  }
  return s2+'Z';
}

function buildPath(){
  var base=+thk.value/10,k=+tpr.value/100,liquid=+liq.value/100;
  thkO.textContent=base.toFixed(1);tprO.textContent=k.toFixed(2);liqO.textContent=liquid.toFixed(2);
  var d='M0 0H'+W+'V'+H+'H0Z';
  for(var i=0;i<polys.length;i++){
    var cen=polys[i].cen,pts=polys[i].pts,n=pts.length;
    var gy=Math.min(1,Math.max(0,cen.y/H));
    var g=Math.max(0.4,base*((1-k)+2*k*gy));
    var minD=Infinity;
    for(var m=0;m<n;m++){
      var A=pts[m],B=pts[(m+1)%n];
      var ex=B.x-A.x,ey=B.y-A.y,L=Math.hypot(ex,ey);
      if(L<1e-6)continue;
      var dist=Math.abs(ey*(cen.x-A.x)-ex*(cen.y-A.y))/L;
      if(dist<minD)minD=dist;
    }
    var r=minD-g/2;
    if(r<base*0.3)continue;
    d+=bubblePath(pts,cen,r,g,liquid);
  }
  return d;
}

function render(){
  mesh.setAttribute('d',buildPath());
  mesh.setAttribute('fill',fg.value);
  if(tr.checked){bg.setAttribute('fill','none')}else{bg.setAttribute('fill',bgc.value)}
  bgc.disabled=tr.checked;
}

function settings(){
  return 'плотность '+cnt.value+', крупных '+big.value+', мелких на крупный '+rat.value+
    ', контраст '+(+spr.value/100).toFixed(2)+', жидкость '+(+liq.value/100).toFixed(2)+
    ', зазор '+(+thk.value/10).toFixed(1)+', перепад '+(+tpr.value/100).toFixed(2)+', сид '+sd.value;
}

function svgFile(){
  var d=buildPath();
  var back=tr.checked?'':'<rect width="'+W+'" height="'+H+'" fill="'+bgc.value+'"/>\n';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">\n'+
    '<title>Bubble pattern</title>\n<desc>'+settings()+'</desc>\n'+back+
    '<path fill="'+fg.value+'" fill-rule="evenodd" d="'+d+'"/>\n</svg>\n';
}

el('dl').addEventListener('click',function(){
  var blob=new Blob([svgFile()],{type:'image/svg+xml'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bubbles-'+cnt.value+'-'+big.value+'-'+rat.value+'-'+sd.value+'.svg';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
});

el('cp').addEventListener('click',function(){
  var btn=this,txt=settings();
  function done(ok){btn.textContent=ok?'Скопировано':'Не вышло — выделите вручную';setTimeout(function(){btn.textContent='Скопировать настройки'},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}
  else{done(false)}
});

el('re').addEventListener('click',function(){sd.value=Math.floor(Math.random()*100000);compute()});
document.querySelectorAll('.rbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.rbtn').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    W=+this.dataset.w; H=+this.dataset.h;
    foam.setAttribute('viewBox','0 0 '+W+' '+H);
    fclipr.setAttribute('width',W); fclipr.setAttribute('height',H);
    bg.setAttribute('width',W); bg.setAttribute('height',H);
    foam.classList.toggle('portrait', H>W);
    compute();
  });
});
[cnt,big,rat,spr,thk].forEach(function(c){c.addEventListener('input',compute)});
sd.addEventListener('change',compute);
[liq,tpr].forEach(function(c){c.addEventListener('input',render)});
[fg,bgc].forEach(function(c){c.addEventListener('input',render)});
tr.addEventListener('change',render);

compute();
})();
</script>
</body>
</html>
